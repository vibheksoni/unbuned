<title>Whiteboard</title>
<script>
"use strict";
const CSS = `
  /* The board's own vars resolve through the vendored @ant/cds token sheet (the static
     style element this page carries — artifacts render self-contained, so the sheet is
     embedded rather than injected). Canvas-read vars (--ground, --grid, --ink, --muted,
     --accent) must land on plain-hex ramp stops: getComputedStyle hands the canvas the
     substituted token TEXT, and ctx.fillStyle cannot evaluate the sheet's hsl(from ...)
     alpha tokens. CSS-only vars (--panel, --shadow) may use any token. Dark mode rides
     the sheet's own data-mode/OS axes (the script mirrors the viewer's data-theme stamp
     onto data-mode), so only board-owned vars need dark overrides here. */
  :root{
    color-scheme: light dark; /* counter the skeleton's :root{color-scheme:light} so UA chrome (scrollbars, caret, overscroll) follows the board's theme */
    --ground:var(--surface-0); --panel:var(--surface-2); --ink:var(--text-primary); --muted:var(--text-secondary);
    --grid:var(--gray-100); --accent:var(--text-accent); --shadow:var(--shadow-md);
    --claude:#c2410c; --claude-ink:#c2410c; --sel:#827dbd; --sticky:#f4e187; --sticky-ink:#3b3320; --p-blue:#bfdff6; --p-pink:#f9cfe0; --p-green:#cdebd2; --p-ink:#3d3929;
    --claude-sticky:#fdba74; --claude-sticky-ink:#231d0d;
    /* the viewer's stroke palette; orange stays Claude's alone, so it is not offered here */
    --s-red:#c92a2a; --s-green:#2b8a3e; --s-blue:#1864ab; --s-violet:#6741d9;
    --here:#2b8a3e; --hair:var(--gray-100);
    --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --hand:"Kalam","Segoe Print","Bradley Hand","Marker Felt","Comic Sans MS","Chalkboard SE",cursive;
  }
  /* Dark overrides for the board-owned values only — the CDS semantic tokens the vars
     above point at flip by themselves. Both axes, mirroring the vendored block's own
     structure: the media block's :where() keeps an explicit light stamp winning over
     OS-dark, and the attribute block forces dark on an OS-light machine. */
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-mode="light"])){
      color-scheme: dark;
      --ground:var(--surface-1); /* dark: the board is the lower surface, chrome floats above it */
      --grid:var(--gray-700);
      --claude:#f0a24a; --claude-ink:#f0a24a; --sel:#b0a7f2; --sticky:#c9b25a; --sticky-ink:#231d0d; --p-blue:#7fb2d6; --p-pink:#d99ab4; --p-green:#8fc79a; --p-ink:#161514;
      --claude-sticky:#f0a24a; --claude-sticky-ink:#231d0d;
      --s-red:#ff8787; --s-green:#69db7c; --s-blue:#74c0fc; --s-violet:#b197fc;
      --here:#69db7c; --hair:var(--gray-700);
    }
  }
  :root[data-mode="dark"]{
    color-scheme: dark;
    --ground:var(--surface-1); /* dark: the board is the lower surface, chrome floats above it */
    --grid:var(--gray-700);
    --claude:#f0a24a; --claude-ink:#f0a24a; --sel:#b0a7f2; --sticky:#c9b25a; --sticky-ink:#231d0d; --p-blue:#7fb2d6; --p-pink:#d99ab4; --p-green:#8fc79a; --p-ink:#161514;
    --claude-sticky:#f0a24a; --claude-sticky-ink:#231d0d;
    --s-red:#ff8787; --s-green:#69db7c; --s-blue:#74c0fc; --s-violet:#b197fc;
    --here:#69db7c; --hair:var(--gray-700);
  }
  :root[data-mode="light"]{
    color-scheme: light;
    /* the paper colours restate their light defaults so every theme block carries
       the sticky palette; --ground/--grid need no restating — the :where() guard
       keeps both dark axes inert under a light stamp, so the base values win */
    --claude:#c2410c; --claude-ink:#c2410c; --sel:#827dbd; --sticky:#f4e187; --sticky-ink:#3b3320; --p-blue:#bfdff6; --p-pink:#f9cfe0; --p-green:#cdebd2; --p-ink:#3d3929;
    --claude-sticky:#fdba74; --claude-sticky-ink:#231d0d;
    --s-red:#c92a2a; --s-green:#2b8a3e; --s-blue:#1864ab; --s-violet:#6741d9;
    --here:#2b8a3e; --hair:var(--gray-100);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--ground);color:var(--ink);font:13px/1.4 var(--ui);overflow:hidden;-webkit-font-smoothing:antialiased}
  #board{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #board.crosshair{cursor:crosshair}
  #board.grab{cursor:grab}
  #board.grabbing{cursor:grabbing}
  #board.move{cursor:move}
  #board.erase{cursor:cell}
  #board.commenting:not(.grabbing){cursor:crosshair} /* comment mode owns the cursor everywhere but mid-pan */

  /* chrome floats on plain panels: hairline border, soft shadow, one radius */
  .panel{background:var(--panel);border:1px solid var(--hair);border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06)}
  .btn{appearance:none;border:0;background:transparent;color:var(--ink);height:32px;min-width:32px;padding:0 9px;border-radius:7px;font:12px var(--ui);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
  .btn:hover{background:var(--hair)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  .btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .tb[aria-pressed="true"]{background:color-mix(in srgb,var(--fill-accent) 18%,transparent);color:var(--accent)}
  .btn.primary{background:var(--fill-accent);color:var(--on-accent);padding:0 14px;font-weight:600;height:36px;border-radius:9px}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.4;cursor:default}
  .btn .key{position:absolute;right:3px;bottom:1px;font-size:8px;line-height:1;color:var(--muted);opacity:.8}
  .tb[aria-pressed="true"] .key{color:var(--accent)}
  .sep{background:var(--hair);flex:none}

  .toolbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:2px;align-items:center;padding:4px;max-width:calc(100% - 400px);overflow-x:auto}
  .toolbar .sep{width:1px;height:20px;margin:0 3px}
  .menuBtn{position:fixed;top:12px;left:12px;padding:2px}
  .topright{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .topright .chips{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  .menu{position:fixed;top:52px;left:12px;min-width:220px;padding:6px;display:none;flex-direction:column;z-index:5}
  .menu.open{display:flex}
  .menu .btn{justify-content:flex-start;height:30px;padding:0 8px;font-size:12.5px}
  .menu .btn .hint{margin-left:auto;color:var(--muted);font-size:11px}
  .menu hr{border:0;border-top:1px solid var(--hair);margin:5px 2px}
  #themeBtn svg{display:none}
  #themeBtn[data-choice="auto"] .t-auto,#themeBtn[data-choice="light"] .t-light,#themeBtn[data-choice="dark"] .t-dark{display:block}

  /* the properties card: stroke, fill, edge, text size */
  .stylebar{position:fixed;left:12px;top:50%;transform:translateY(-50%);width:172px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
  .stylebar[hidden],.stylebar [hidden]{display:none}
  .stylebar h3{margin:0 0 5px;font:11px var(--ui);color:var(--muted);font-weight:500}
  .stylebar .row{display:flex;gap:4px;flex-wrap:wrap}
  .sw{appearance:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--hair);cursor:pointer;padding:0;background:var(--c)}
  .sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
  .sw.claude{display:none}
  .stylebar[data-claude="1"] .sw.claude{display:block}
  .stylebar[data-claude="1"] .sw[data-stroke]{opacity:.28;pointer-events:none;outline:0}
  .opt{appearance:none;width:32px;height:28px;border-radius:6px;border:1px solid var(--hair);background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0}
  .opt svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
  .opt[aria-pressed="true"]{background:var(--hair);border-color:var(--accent)}
  .opt:disabled{opacity:.35;cursor:default}
  .sizer{display:flex;align-items:center;gap:2px}
  .sizer .btn{height:28px;min-width:28px;padding:0 6px;border:1px solid var(--hair)}
  .sizer .zval{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}

  .zoombar{position:fixed;left:12px;bottom:12px;display:flex;gap:0;align-items:center;padding:2px}
  .zoombar .btn{height:28px;min-width:28px;padding:0 6px}
  .zoombar .zval{min-width:50px;height:28px;font-variant-numeric:tabular-nums;color:var(--ink);font-size:12px}
  .histbar{position:fixed;left:128px;bottom:12px;display:flex;gap:0;padding:2px}
  .histbar .btn{height:28px;min-width:30px;padding:0 6px}
  .helpBtn{position:fixed;right:12px;bottom:12px;padding:2px}
  .helpBtn .btn{font-weight:700;font-size:14px}

  @media (max-width: 760px){
    .toolbar{top:56px;max-width:calc(100% - 24px)}
    .topright .chips{position:fixed;top:100px;right:12px}
    .stylebar,.stylebar:not([hidden]){display:none}
  }
  #wb-anchors{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .wb-a{position:absolute;display:block;pointer-events:none}
  .ctx{position:fixed;min-width:160px;padding:5px;display:none;flex-direction:column;z-index:6}
  .ctx.open{display:flex}
  .ctx .btn{justify-content:flex-start;height:30px;padding:0 8px;font-size:12.5px}
  .ctx .btn .hint{margin-left:auto;color:var(--muted);font-size:11px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:12px;font-size:11px;color:var(--muted);white-space:nowrap}
  .chip.toggle{border:0;cursor:pointer;font:inherit;font-size:11px}
  .chip.toggle i{width:22px;height:12px;border-radius:6px;background:var(--hair);position:relative;transition:background .15s}
  .chip.toggle i::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--panel);transition:left .15s}
  .chip.toggle[aria-pressed="true"] i{background:var(--claude)}
  .chip.toggle[aria-pressed="true"] i::after{left:12px}
  .chip i{width:7px;height:7px;border-radius:50%;background:var(--grid);display:inline-block;flex:none}
  .sync[data-s="saving"] i{background:var(--accent)}
  .sync[data-s="local"] i{background:var(--sticky)}
  .plane{background:var(--panel);border:1px solid var(--hair);border-radius:12px;box-shadow:var(--shadow-lg)}
  /* Claude lives on the board: a pixel figure standing in board space (the wrapper follows pan and zoom) */
  #clawd{position:fixed;left:0;top:0;width:60px;height:54px;transform-origin:0 0;z-index:3;cursor:pointer;touch-action:none;will-change:transform;contain:layout}
  #clawd .shadow{position:absolute;left:6px;bottom:0;width:48px;height:8px;border-radius:50%;background:rgba(20,20,19,.22);filter:blur(2px)}
  #clawd > svg{position:absolute;left:0;top:0;overflow:visible;shape-rendering:crispEdges;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
  #clawd .eyes{animation:blink 3.7s steps(1,end) infinite}
  #clawd.walk > svg,#clawd.walk .eyes{animation:none}
  @keyframes breathe{50%{transform:scale(1.014,1.024)}}
  @keyframes blink{0%,97%{opacity:1}97.1%,100%{opacity:0}}
  #clawd .legsB{opacity:0}
  #clawd[data-f="1"] .legsA{opacity:0} #clawd[data-f="1"] .legsB{opacity:1}
  #clawd[data-away="1"] > svg{opacity:.35;filter:grayscale(1)}
  #clawd[data-away="1"] .shadow{opacity:.4}
  #clawd .ring{position:absolute;inset:-8px -8px -4px;border:2px solid var(--sel);border-radius:8px;pointer-events:none;display:none}
  #clawd.held{cursor:grabbing}
  #clawd.held > svg{animation:none;transform:translateY(-7px) rotate(-5deg)}
  #clawd.held .shadow{transform:scale(.72);opacity:.5}
  #clawd.open .ring{display:block}
  #clawd.open .think{display:none}
  #clawd .zz{position:absolute;left:46px;top:-14px;font:600 11px var(--ui);color:var(--muted);display:none;pointer-events:none}
  #clawd[data-away="1"] .zz{display:block}
  #clawd .work{position:absolute;left:40px;top:-16px;display:none;gap:3px;pointer-events:none}
  #clawd .work i{width:5px;height:5px;border-radius:1px;background:var(--muted);animation:dots 1.1s steps(2,end) infinite}
  #clawd .work i:nth-child(2){animation-delay:.2s} #clawd .work i:nth-child(3){animation-delay:.4s}
  #clawd[data-busy="1"] .work{display:inline-flex}
  #clawd[data-busy="1"] > svg{filter:saturate(.55);transform:translateX(-3px) skewY(-3deg)}
  #clawd[data-busy="1"] .eyes rect{height:3px;transform:translateY(6px)}
  #clawd[data-busy="1"] .think{background:var(--muted)}
  .cmenu .hint{font:12px/16px var(--ui);color:var(--muted);padding:2px 8px 4px}
  /* the menu above Claude: ask field whose placeholder is Claude's suggestion, and the proactive switch */
  .cmenu{position:absolute;left:50%;bottom:calc(100% + 16px);transform:translateX(-50%) scale(.96);transform-origin:50% 100%;width:300px;padding:4px;display:flex;flex-direction:column;gap:4px;z-index:5;text-align:left;white-space:normal;cursor:default;opacity:0;pointer-events:none;transition:opacity .18s var(--ease-out),transform .18s var(--ease-out)}
  #clawd.open .cmenu{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
  .cmenu::after{content:"";position:absolute;left:50%;bottom:-7px;width:12px;height:12px;margin-left:-6px;background:var(--panel);border-right:1px solid var(--hair);border-bottom:1px solid var(--hair);transform:rotate(45deg)}
  .cmenu .ask{display:flex;align-items:center;gap:8px;padding:0 2px 0 8px;height:32px}
  .cmenu .ask input{flex:1 1 auto;min-width:0;border:0;outline:0;background:transparent;font:14px/20px var(--ui);color:var(--ink);padding:0}
  .cmenu .ask input::placeholder{color:var(--muted);opacity:1}
  .cmenu .send{appearance:none;border:0;width:28px;height:28px;border-radius:8px;background:#d97757;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0;transition:transform .12s}
  .cmenu .send:active{transform:scale(.92)}
  .cmenu .send:disabled{opacity:.45;cursor:default}
  .cmenu .send svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
  .cmenu .hr{height:1px;background:var(--hair);margin:0 -4px}
  .cmenu .pro{display:flex;align-items:center;gap:10px;padding:0 4px 0 8px;height:32px;font-size:13px;line-height:18px;color:var(--ink);cursor:pointer}
  .cmenu .pro .txt{flex:1 1 auto;min-width:0;white-space:nowrap}
  .switch{appearance:none;border:0;box-sizing:border-box;width:36px;height:20px;border-radius:999px;background:var(--alpha-3);padding:2px;flex:none;position:relative;cursor:pointer;transition:background .2s}
  .switch i{display:block;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:transform .22s var(--ease-overshoot)}
  .switch[aria-checked="true"]{background:var(--fill-accent)}
  .switch[aria-checked="true"] i{transform:translateX(16px)}
  /* Claude's thought bubble: clay paper beside the figure, words stream, dots pulse while it works */
  .think{position:absolute;left:70px;top:2px;width:max-content;max-width:250px;padding:5px 9px;background:#d97757;border-radius:10px 10px 10px 3px;box-shadow:var(--shadow-sm);font:12.5px/17px var(--ui);color:#fff;z-index:3;text-align:left;white-space:normal;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .2s var(--ease-out),transform .2s var(--ease-out)}
  .think.on{opacity:1;transform:none}
  .think .dots{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
  .think .dots i{width:4px;height:4px;border-radius:50%;background:#fff;opacity:.4}
  .think.busy .dots i{animation:dots 1.2s ease-in-out infinite}
  .think .dots i:nth-child(2){animation-delay:.15s} .think .dots i:nth-child(3){animation-delay:.3s}
  @keyframes dots{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
  /* Claude's unasked additions carry a Suggested chip until someone keeps them; hover offers Keep / dismiss */
  #chips{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
  .sugchip{position:absolute;display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px 0 6px;border-radius:999px;background:var(--panel);border:1px solid var(--hair);box-shadow:var(--shadow-sm);font:500 11px/16px var(--ui);color:var(--claude-ink);white-space:nowrap;transform:translate(10px,-11px)}
  .sugchip svg{width:10px;height:10px;fill:var(--claude);stroke:none}
  .strip{position:fixed;display:none;align-items:center;gap:2px;padding:4px;border-radius:10px;z-index:4;transform:translate(0,calc(-100% - 10px))}
  .strip.open{display:flex}
  .strip .si{appearance:none;border:0;background:transparent;height:24px;min-width:24px;border-radius:6px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:4px;font:13px/19px var(--ui);color:var(--ink);white-space:nowrap;cursor:pointer}
  .strip .si.ic{width:24px;padding:0}
  .strip .si:hover{background:var(--alpha-1)}
  .strip .si svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){ .think.busy .dots i{animation:none} .cmenu,.think,.switch i{transition:none} #clawd > svg,#clawd .eyes,#clawd .work i{animation:none} }
  #editor::selection{background:color-mix(in srgb,var(--accent) 30%,transparent);color:transparent}
  #editor{position:fixed;display:none;resize:none;transform-origin:0 0;background:transparent;color:var(--ink);border:1.5px dashed var(--accent);outline:none;padding:2px 4px;font-family:var(--hand);white-space:pre;overflow:hidden;text-align:center;border-radius:4px}

  .toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#1e1e2e;color:#f3f3f1;padding:8px 14px;border-radius:9px;font-size:12.5px;opacity:0;transition:opacity .18s ease;pointer-events:none;max-width:min(520px,calc(100% - 40px));text-align:center}
  .toast.show{opacity:1}

  .modal{position:fixed;inset:0;background:rgba(11,11,11,.45);display:none;place-items:center;padding:24px;z-index:10}
  .modal.open{display:grid}
  .modal .card{color:var(--ink);padding:16px;max-width:min(920px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
  .modal .card header{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .modal .card header h2{margin:0;font:600 14px var(--ui)}
  .modal .card .imgwrap{overflow:auto;border:1px solid var(--hair);border-radius:6px;background:var(--ground)}
  .modal .card img{display:block;max-width:100%;height:auto}
  .modal .card p{margin:0;color:var(--muted);font-size:12px}
  .modal textarea{width:min(440px,80vw);min-height:84px;resize:vertical;font:14px/1.4 var(--ui);color:var(--ink);background:var(--ground);border:1px solid var(--hair);border-radius:8px;padding:8px;outline:none}
  .modal textarea:focus{border-color:var(--accent)}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:12.5px;margin:0;min-width:min(420px,80vw)}
  .keys dt{color:var(--muted);white-space:nowrap}
  .keys dd{margin:0}
  kbd{font:11px/1 var(--ui);border:1px solid var(--hair);border-bottom-width:2px;border-radius:4px;padding:2px 5px;color:var(--ink);background:var(--panel)}

  @media (prefers-reduced-motion: reduce){ .toast{transition:none} }
`;

const MARKUP = `
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&amp;display=swap">
<canvas id="board" class="crosshair" aria-label="Whiteboard canvas"></canvas>
<div class="panel menuBtn"><button class="btn" id="menuBtn" title="Menu" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button></div>
<div class="panel menu" id="menu" role="menu">

  return !!tokenCss && tokenCss.indexOf('</') === -1 && tokenCss.indexOf('\uFFFD') === -1

// block must survive publish → reload → publish byte-identically) is testable headless.
// The JSON block comes first so a reading session finds the board state without running JS.
// Every top-level function must appear in the emission list below — one left out survives
// generation 1 and breaks only when the republished page itself republishes.
// Parse-safety: the state-block HTML comment emitted below is the page's only

      c.beginPath(); c.roundRect ? c.roundRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2, 12) : c.rect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2); c.stroke();

      }
      case 'ellipse': {
        const b = normRect(e); skEllipse(c, r, b.x + b.w/2, b.y + b.h/2, b.w/2, b.h/2);

      }
      case 'cylinder': {

        skLine(c, r, b.x + b.w, b.y + ry, b.x + b.w, b.y + b.h - ry);
        skHalfEllipse(c, r, b.x + b.w/2, b.y + b.h - ry, b.w/2, ry);

      case 'diamond': {

        skLine(c, r, cx, b.y + b.h, b.x, cy); skLine(c, r, b.x, cy, cx, b.y);
        c.setLineDash([]);

        break;
      }
      case 'sticky': {

        const b = normRect(e), paper = stickyPaper(e), ear = Math.min(18, b.w / 5, b.h / 5);
        const tilt = ((e.seed % 7) - 3) * 0.006;
        c.save();
        c.setLineDash([]);

        c.fillStyle = paper.fill;
        c.beginPath(); c.moveTo(0, 0); c.lineTo(b.w, 0); c.lineTo(b.w, b.h - ear); c.lineTo(b.w - ear, b.h); c.lineTo(0, b.h); c.closePath(); c.fill();
        c.restore();
        // the lifted corner: a darker fold where the paper turns up
        c.fillStyle = 'rgba(0,0,0,.14)';
        c.beginPath(); c.moveTo(b.w, b.h - ear); c.lineTo(b.w - ear, b.h); c.lineTo(b.w - ear * .9, b.h - ear * .9); c.closePath(); c.fill();
        // a faint band along the top where the glue strip sits
        c.fillStyle = 'rgba(0,0,0,.05)'; c.fillRect(0, 0, b.w, Math.min(14, b.h * .16));
        if(lbl){
          const ib = innerBox(e), f = fitText(c, lbl, Math.max(12, ib.w), Math.max(12, ib.h), STICKY_FONT);
          c.beginPath(); c.rect(6, 6, b.w - 12, b.h - 12); c.clip();
          c.font = handFont(f.px); c.fillStyle = paper.ink; c.textBaseline = 'top';
          f.lines.forEach((l, i) => c.fillText(l, STICKY_PAD, STICKY_PAD - 2 + i * f.px * 1.35));
        }
        c.restore();
        break;
      }
      case 'image': {
        const b = normRect(e), img = imageFor(e);
        c.setLineDash([]);

        else {
          // not here yet (its bytes come only with a publish by a tab that holds them) or unreadable: a hatched placeholder
          c.save(); c.globalAlpha = .5; c.strokeStyle = C.muted; c.lineWidth = 1.2; c.strokeRect(b.x, b.y, b.w, b.h);
          c.beginPath(); c.moveTo(b.x, b.y); c.lineTo(b.x + b.w, b.y + b.h); c.moveTo(b.x + b.w, b.y); c.lineTo(b.x, b.y + b.h); c.stroke();
          c.globalAlpha = 1; drawMultiline(c, e.src ? 'image' : 'picture not sent yet', b.x + b.w / 2, b.y + b.h / 2, 13, C.muted);
          c.restore();

        break;
      }
      case 'text': {
        const px = textPx(e);

          c.save(); c.font = handFont(px); c.fillStyle = ink; c.textBaseline = 'top';
          live.split('\n').forEach((l, i) => c.fillText(l, e.x + 4, e.y + 4 + i * px * 1.35));
          c.restore();
        }
        break;
      }
      case 'line': {
        skLine(c, r, e.x1, e.y1, e.x2, e.y2);
        break;
      }
      case 'arrow': {
        const {p1, p2} = arrowEndpoints(e);
        skLine(c, r, p1.x, p1.y, p2.x, p2.y);
        c.setLineDash([]);
        const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x), L = Math.min(18, Math.max(10, Math.hypot(p2.x - p1.x, p2.y - p1.y) * .35));
        skLine(c, r, p2.x, p2.y, p2.x - L * Math.cos(ang - .46), p2.y - L * Math.sin(ang - .46), 1);
        skLine(c, r, p2.x, p2.y, p2.x - L * Math.cos(ang + .46), p2.y - L * Math.sin(ang + .46), 1);

          if(e === editing || Math.abs(Math.cos(ang)) * m.w + Math.abs(Math.sin(ang)) * m.h < shaft - 2 * L){

        }

    }
  }

  function drawSelection(c){
    if(!selected.size) return;
    const pad = 6 / view.scale;
    c.save();
    c.strokeStyle = C.accent; c.lineWidth = 1 / view.scale; c.setLineDash([5 / view.scale, 4 / view.scale]);
    for(const e of els){
      if(!selected.has(e.id) || (editing && editing.id === e.id && e.type === 'text')) continue; // a text being typed is framed by its editor, not by a stale outline
      const b = bbox(e);
      c.strokeRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2);
    }
    c.setLineDash([]);
    const e = selOne(); // handles only apply to a single element
    if(e && !(editing && editing.id === e.id && e.type === 'text')){
      const b = bbox(e);
      c.fillStyle = C.ground; c.strokeStyle = C.accent; c.lineWidth = 1.5 / view.scale;
      // the drawn handle never exceeds its clickable zone, which is capped on small shapes
      const hs = isBoxy(e) ? Math.min(5 / view.scale, b.w / 6, b.h / 6) : 5 / view.scale;
      for(const h of handles(e)){
        c.beginPath(); c.rect(h.x - hs, h.y - hs, hs * 2, hs * 2); c.fill(); c.stroke();
      }
    }
    c.restore();
  }

  // the box an arrow end is about to latch onto lights up while the end is dragged
  function drawSnapTarget(c){
    if(!drag || !drag.snapId) return;
    const t = els.find(e => e.id === drag.snapId); if(!t) return;
    const b = bbox(t), pad = 5 / view.scale;
    c.save(); c.strokeStyle = C.accent; c.globalAlpha = .55; c.lineWidth = 2.5 / view.scale; c.setLineDash([]);
    c.beginPath(); c.roundRect ? c.roundRect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2, 10) : c.rect(b.x - pad, b.y - pad, b.w + pad * 2, b.h + pad * 2); c.stroke();
    c.restore();
  }
  function drawMarquee(c){
    if(!drag || drag.mode !== 'marquee' || !drag.moved) return;
    const r = marqueeRect();
    c.save();
    c.strokeStyle = C.accent; c.fillStyle = C.accent; c.lineWidth = 1 / view.scale;
    c.setLineDash([4 / view.scale, 3 / view.scale]);
    c.globalAlpha = .08; c.fillRect(r.x, r.y, r.w, r.h);
    c.globalAlpha = 1; c.strokeRect(r.x, r.y, r.w, r.h);
    c.restore();
  }

  function drawGrid(c, w, h){
    const s = view.scale, step = GRID * (s < .5 ? 4 : s < .9 ? 2 : 1);
    const x0 = -view.x / s, y0 = -view.y / s, x1 = x0 + w / s, y1 = y0 + h / s;
    if(step * s < 6) return;
    c.fillStyle = C.grid;
    const r = Math.max(.9, 1.1 / s);
    for(let x = Math.floor(x0 / step) * step; x < x1; x += step){
      for(let y = Math.floor(y0 / step) * step; y < y1; y += step){
        c.fillRect(x - r/2, y - r/2, r, r);
      }
    }
  }

  // ---------- images ----------
  // decoded pictures are cached by their bytes (copies share one), most recently drawn last, and the
  // cache always holds at least every picture on the board, so a frame never evicts what it is about to draw
  const imgCache = new Map();
  function imageFor(e){
    if(!e.src) return null;
    let img = imgCache.get(e.src);
    if(img){ imgCache.delete(e.src); imgCache.set(e.src, img); return img; }
    img = new Image(); img.onload = () => kick(); img.src = e.src;
    imgCache.set(e.src, img);
    const keep = Math.max(64, els.reduce((n, x) => n + (x.type === 'image' ? 1 : 0), 0) + 8);
    while(imgCache.size > keep) imgCache.delete(imgCache.keys().next().value);
    return img;
  }
  const imgBytes = () => els.reduce((n, e) => n + (e.type === 'image' && e.src ? e.src.length : 0), 0);
  let bigPictureTold = false; // the paster hears once per page that a big picture waits for their publish
  // shrink a picked/pasted/dropped file to something the board can carry inline, then place it
  async function insertImage(file, at){
    if(!file || !/^image\//.test(file.type)){ toast('That isn’t an image file.'); return; }
    if(els.length >= MAX_ELS){ toast(BOARD_FULL); return; }
    let bmp;
    try{ bmp = await createImageBitmap(file); }catch(_){ toast('Couldn’t read that image.'); return; }
    const MAX_SIDE = 1600, scale = Math.min(1, MAX_SIDE / Math.max(bmp.width, bmp.height));
    const cw = Math.max(1, Math.round(bmp.width * scale)), ch = Math.max(1, Math.round(bmp.height * scale));
    const off = document.createElement('canvas'); off.width = cw; off.height = ch;
    off.getContext('2d').drawImage(bmp, 0, 0, cw, ch);
    let src = file.type === 'image/png' && file.size < 350000 ? off.toDataURL('image/png') : '';
    if(!src || src.length > IMG_MAX_CHARS * .6){
      // JPEG has no alpha: transparent pixels would come out black, so they are laid on white first
      const ctx2 = off.getContext('2d'); ctx2.globalCompositeOperation = 'destination-over'; ctx2.fillStyle = '#fff'; ctx2.fillRect(0, 0, cw, ch);
      for(let q = .85; (!src || src.length > IMG_MAX_CHARS * .6) && q >= .4; q -= .15) src = off.toDataURL('image/jpeg', q);
    }
    if(!IMG_SRC_RE.test(src) || src.length > IMG_MAX_CHARS){ toast('That image is too large for the board.'); return; }
    if(imgBytes() + src.length > IMG_MAX_TOTAL){ toast('The board can’t hold more image data — remove a picture first.'); return; }
    const w = Math.min(360, cw), h = Math.round(w * ch / cw);
    const p = at || screenToWorld(board.clientWidth / 2, board.clientHeight / 2);
    const el = {id: uid(), type: 'image', x: snapv(p.x - w / 2), y: snapv(p.y - h / 2), w, h, src, label: (file.name || '').slice(0, 120), seed: 1 + Math.floor(Math.random() * 1e9)};
    mutate(() => { els.push(el); selected = new Set([el.id]); });
    setTool('select');
    // the room carries only a placeholder and the store only a doc under its cap: a bigger picture reaches the others with this tab's next publish, and they should not wait for it
    if(!readOnly && !bigPictureTold && (elsCol || !storeSettled ? JSON.stringify(el).length > STORE_DOC_MAX : wireBytes(el) > NET_CHUNK)){ bigPictureTold = true; toast('This picture is too big to send live. Others will see it once you Save for everyone or ask Claude.', 7000); }
  }
  board.addEventListener('dragover', ev => { if(ev.dataTransfer && Array.from(ev.dataTransfer.items || []).some(i => i.kind === 'file')) ev.preventDefault(); });
  board.addEventListener('drop', ev => {
    const f = ev.dataTransfer && Array.from(ev.dataTransfer.files || []).find(x => /^image\//.test(x.type));
    if(!f) return;
    ev.preventDefault();
    const {sx, sy} = evtPoint(ev); insertImage(f, screenToWorld(sx, sy));
  });
  window.addEventListener('paste', ev => {
    if(editing || ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'INPUT') return;
    const f = ev.clipboardData && Array.from(ev.clipboardData.files || []).find(x => /^image\//.test(x.type));
    if(f){ ev.preventDefault(); insertImage(f, null); }
  });

  // ---------- main render ----------
  function render(){
    const w = board.clientWidth, h = board.clientHeight;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.x, dpr * view.y);
    drawGrid(ctx, w, h);
    if(glowIds.size && Date.now() > glowUntil) glowIds = new Set();
    // only what the viewport can show is drawn; the margin covers stroke overhang in world units
    // plus decorations sized in device px (sticky shadows), whose world extent grows as 1/scale
    const cullM = 40 + 24 / view.scale;
    const port = {x: -view.x / view.scale - cullM, y: -view.y / view.scale - cullM, w: w / view.scale + cullM * 2, h: h / view.scale + cullM * 2};
    for(const e of els){ const d = ghosts.get(e.id) || e; if(selected.has(e.id) || e === editing || rectsIntersect(port, paintBox(d))) drawElement(ctx, d); }
    for(const g of ghosts.values()) if(!els.some(e => e.id === g.id)) drawElement(ctx, g); // a shape still being drawn elsewhere
    ctx.setLineDash([]);
    drawSnapTarget(ctx);
    drawSelection(ctx);
    drawMarquee(ctx);
    drawCursors(ctx);
    if(!els.length && !ghosts.size){
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.textAlign = 'center'; ctx.fillStyle = C.muted;
      // shrunk to the width at hand, so a phone reads the whole line
      const line = (txt, px, fontOf, y) => { let s = px; ctx.font = fontOf(s); while(s > 9 && ctx.measureText(txt).width > w - 32) ctx.font = fontOf(--s); ctx.fillText(txt, w / 2, y); };
      line('drag anywhere to sketch a box, then draw arrows between things', 22, handFont, h / 2 - 12);
      line('Ask by clicking Claude on the board · answers land in orange, and Claude may jump in live', 12.5, s => s + 'px ' + C.ui, h / 2 + 18);
      ctx.textAlign = 'start';
    }
    document.getElementById('zoomVal').textContent = Math.round(view.scale * 100) + '%';
    figPlace(); positionChips();
    positionAnchors();
    syncEditor();
    updateSizer();
    if(glowIds.size) kick(); // keep the halo fading
  }
  // animation frames funnel through one pending request, however many things are moving
  let rafPending = false;
  function kick(){ if(rafPending) return; rafPending = true; requestAnimationFrame(() => { rafPending = false; render(); }); }
  // other people's pointers: a small arrow in that tab's hue that fades once it stops moving
  let cursorTimer = null;
  function drawCursors(c){
    clearTimeout(cursorTimer);
    if(!cursors.length) return;
    const now = Date.now(), s = 1 / view.scale;
    let any = false;
    c.save(); c.setLineDash([]);
    for(const p of cursors){
      const a = Math.max(0, 1 - (now - p.at) / 5000);
      if(a <= 0) continue;
      any = true;
      c.globalAlpha = .85 * a;
      c.fillStyle = 'hsl(' + p.hue + ' 65% 52%)'; c.strokeStyle = C.ground; c.lineWidth = 1.5 * s;
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x + 9 * s, p.y + 13 * s); c.lineTo(p.x + 3.5 * s, p.y + 11 * s); c.lineTo(p.x, p.y + 16 * s); c.closePath();
      c.fill(); c.stroke();
    }
    c.restore();
    if(any) cursorTimer = setTimeout(kick, 400); // keep fading without a pointer event of our own
  }

  function resize(){
    dpr = Math.max(1, window.devicePixelRatio || 1);
    board.width = Math.round(board.clientWidth * dpr);
    board.height = Math.round(board.clientHeight * dpr);
    render();
  }
  window.addEventListener('resize', resize);

  // ---------- tools & toolbar ----------
  const toolKeys = {h: 'hand', v: 'select', '1': 'select', r: 'rect', '2': 'rect', y: 'diamond', '3': 'diamond', o: 'ellipse', '4': 'ellipse',
    d: 'cylinder', s: 'sticky', a: 'arrow', '5': 'arrow', l: 'line', '6': 'line', p: 'pen', '7': 'pen', t: 'text', '8': 'text', e: 'eraser', '0': 'eraser'};
  const STYLED = t => t !== 'hand' && t !== 'eraser' && t !== 'select' && t !== 'text';
  function setTool(t){
    if(!document.querySelector('.tb[data-tool="' + t + '"]')) t = 'rect'; // a stored tool this page no longer has
    tool = t;
    document.querySelectorAll('.tb').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t ? 'true' : 'false'));
    board.className = (t === 'select' ? '' : t === 'hand' ? 'grab' : t === 'eraser' ? 'erase' : 'crosshair') + (commentMode ? ' commenting' : '');
    board.style.cursor = '';
    if(t !== 'select') hideStrip(); // a keyboard tool switch fires no pointermove, and an open strip would eat the first stroke
    syncStylebar();
    saveSession();
  }
  document.querySelectorAll('.tb').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  // the click that dismisses the open menu only dismisses (the base note sheet was modal): let it through
  // and an armed eraser deletes whatever it lands on - for the whole room - while pen leaves a stray dot
  document.addEventListener('pointerdown', ev => { if(!fig.contains(ev.target)){ if(fig.classList.contains('open')) ev.stopPropagation(); closeAsk(); } if(!keepStrip.contains(ev.target)) hideStrip(); }, true);
