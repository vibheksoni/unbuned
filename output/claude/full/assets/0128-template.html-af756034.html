  try { const mq = window.matchMedia('(prefers-color-scheme: dark)'); (mq.addEventListener ? mq.addEventListener('change', requestRender) : mq.addListener(requestRender)); } catch (_) {}
  new MutationObserver(() => requestRender()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts && document.fonts.load) {
    document.fonts.load(`24px ${FONT_FAMILY}`).then(() => { for (const el of state.elements) if (el.type === 'text') measureText(el); requestRender(); }).catch(() => {});
  }
  updateUI(); refreshMenu(); updateHoverCursor(-1, -1); requestRender();
  if (loadedFromPublished) { commit(); setTimeout(zoomToFit, 0); }
  else {
    // A replayed stash lives only in this tab's sessionStorage until it is
    // saved to the shared draft - commit here (the wholesale restore path
    // clears loadedFromPublished, so it cannot ride the branch above), or
    // closing the tab before the next edit drops the restored work.
    if (stashRestored) commit();
    setTimeout(() => rescueViewport('Jumped to your drawing'), 0);
  }
  startSyncLoop();
  checkWaiting(publishedInfo);
  afterReloadNotice();
}
init();
};sketchboardApp();
